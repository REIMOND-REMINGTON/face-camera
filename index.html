<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Cámara facial
  </title>


  <script
    src="https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      min-height: 100vh;

      background: #f5f7fa;

      color: #172033;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: grid;

      place-items: center;

      padding: 20px;
    }


    .card {
      width:
        min(
          500px,
          100%
        );

      background: white;

      border:
        1px solid #e5e9ef;

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 12px 40px
        rgba(17, 24, 39, 0.08);
    }


    h1 {
      margin: 0;

      font-size: 21px;
    }


    .description {
      margin:
        7px
        0
        16px;

      color: #687386;

      font-size: 13px;

      line-height: 1.5;
    }


    .tip {
      margin-bottom: 16px;

      padding: 11px 13px;

      border-radius: 10px;

      background: #fff7e5;

      color: #725100;

      font-size: 12px;

      line-height: 1.5;
    }


    .tip.hidden {
      display: none;
    }


    .camera {
      position: relative;

      width: 100%;

      aspect-ratio: 3 / 4;

      overflow: hidden;

      background: #111827;

      border-radius: 16px;
    }


    video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transform:
        scaleX(-1);
    }


    .guide {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 65%;
      height: 58%;

      transform:
        translate(-50%, -50%);

      border:
        3px solid
        rgba(255, 255, 255, 0.65);

      border-radius: 48%;

      pointer-events: none;
    }


    .camera.ready .guide {
      border-color: #4ade80;
    }


    .progress-wrapper {
      margin-top: 16px;
    }


    .progress-text {
      margin-bottom: 7px;

      color: #687386;

      font-size: 12px;

      text-align: center;
    }


    .progress-track {
      width: 100%;
      height: 8px;

      overflow: hidden;

      border-radius: 999px;

      background: #e7ebf0;
    }


    .progress-bar {
      width: 0%;
      height: 100%;

      background: #172033;

      transition:
        width 180ms ease;
    }


    .status {
      min-height: 54px;

      margin-top: 14px;

      padding: 12px;

      background: #f5f7fa;

      border-radius: 10px;

      font-size: 13px;

      text-align: center;

      line-height: 1.5;
    }


    .actions {
      display: grid;

      gap: 10px;

      margin-top: 14px;
    }


    button {
      min-height: 44px;

      border: 0;
      border-radius: 10px;

      cursor: pointer;

      font: inherit;
      font-weight: 600;
    }


    #captureButton {
      background: #172033;
      color: white;
    }


    #captureButton:disabled {
      cursor: default;

      opacity: 0.45;
    }


    .secondary {
      background: #eef1f5;
      color: #172033;
    }


    .error {
      color: #a93636;
    }

  </style>

</head>


<body>

  <main class="card">

    <h1 id="pageTitle">
      Cámara facial
    </h1>


    <p
      id="pageDescription"
      class="description"
    >
      Inicializando...
    </p>


    <div
      id="glassesTip"
      class="tip hidden"
    >
      Para mejorar el reconocimiento con cambios de apariencia:
      si usas gafas, realiza las primeras muestras con ellas y
      cuando el sistema lo indique cambia a sin gafas.
    </div>


    <div
      id="cameraContainer"
      class="camera"
    >

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="guide"></div>

    </div>


    <div class="progress-wrapper">

      <div
        id="progressText"
        class="progress-text"
      >
        Preparando...
      </div>


      <div class="progress-track">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <div
      id="status"
      class="status"
    >
      Inicializando sistema...
    </div>


    <div class="actions">

      <button
        id="captureButton"
        type="button"
        disabled
      >
        Continuar
      </button>


      <button
        id="cancelButton"
        type="button"
        class="secondary"
      >
        Cancelar
      </button>

    </div>

  </main>


  <script>

    /**
     * ========================================================
     * PARÁMETROS
     * ========================================================
     */

    var params =
      new URLSearchParams(
        window.location.search
      );


    var token =
      params.get(
        'token'
      ) || '';


    var mode =
      params.get(
        'mode'
      ) || '';


    var samplesRequired =
      parseInt(
        params.get(
          'samples'
        ) || '5',
        10
      );


    var minConfidence =
      Number(
        params.get(
          'minConfidence'
        ) || '0.80'
      );


    if (
      !Number.isFinite(
        samplesRequired
      ) ||
      samplesRequired <
        1
    ) {

      samplesRequired =
        5;
    }


    if (
      !Number.isFinite(
        minConfidence
      )
    ) {

      minConfidence =
        0.80;
    }


    /**
     * ========================================================
     * DOM
     * ========================================================
     */

    var video =
      document.getElementById(
        'video'
      );


    var statusElement =
      document.getElementById(
        'status'
      );


    var captureButton =
      document.getElementById(
        'captureButton'
      );


    var cancelButton =
      document.getElementById(
        'cancelButton'
      );


    var cameraContainer =
      document.getElementById(
        'cameraContainer'
      );


    var pageTitle =
      document.getElementById(
        'pageTitle'
      );


    var pageDescription =
      document.getElementById(
        'pageDescription'
      );


    var progressText =
      document.getElementById(
        'progressText'
      );


    var progressBar =
      document.getElementById(
        'progressBar'
      );


    var glassesTip =
      document.getElementById(
        'glassesTip'
      );


    /**
     * ========================================================
     * ESTADO
     * ========================================================
     */

    var stream =
      null;


    var detectionRunning =
      false;


    var stopped =
      false;


    var capturing =
      false;


    var enrollmentIndex =
      0;


    var enrollmentEmbeddings =
      [];


    var enrollmentQualities =
      [];


    var enrollmentLabels =
      [];


    /**
     * ========================================================
     * INSTRUCCIONES DE REGISTRO
     * ========================================================
     */

    var enrollmentInstructions = [

      {
        label:
          'frontal_a',

        text:
          'Mira directamente al frente.'
      },

      {
        label:
          'izquierda_a',

        text:
          'Gira ligeramente la cabeza hacia tu izquierda.'
      },

      {
        label:
          'derecha_a',

        text:
          'Gira ligeramente la cabeza hacia tu derecha.'
      },

      {
        label:
          'frontal_b',

        text:
          'Mira nuevamente al frente. Si usas gafas, cambia ahora a con/sin gafas.'
      },

      {
        label:
          'izquierda_b',

        text:
          'Gira ligeramente hacia tu izquierda con esta segunda apariencia.'
      },

      {
        label:
          'derecha_b',

        text:
          'Última muestra: gira ligeramente hacia tu derecha.'
      }

    ];


    function getEnrollmentInstruction(
      index
    ) {

      if (
        enrollmentInstructions[
          index
        ]
      ) {

        return enrollmentInstructions[
          index
        ];

      }


      return {

        label:
          'muestra_' +
          (
            index + 1
          ),

        text:
          'Cambia ligeramente tu posición y mira nuevamente a la cámara.'

      };
    }


    /**
     * ========================================================
     * CONFIGURAR UI
     * ========================================================
     */

    if (
      mode ===
      'recognize'
    ) {

      document.title =
        'Reconocer persona';


      pageTitle.textContent =
        'Reconocer persona';


      pageDescription.textContent =
        'Mantén el rostro visible. El sistema tomará varias muestras automáticamente.';


      captureButton.textContent =
        'Verificar identidad';


      glassesTip.classList.add(
        'hidden'
      );

    } else {

      document.title =
        'Registrar perfil facial';


      pageTitle.textContent =
        'Registrar perfil facial';


      pageDescription.textContent =
        'Crearemos un perfil con varias muestras para mejorar la precisión.';


      captureButton.textContent =
        'Capturar muestra 1/' +
        samplesRequired;


      glassesTip.classList.remove(
        'hidden'
      );

    }


    /**
     * ========================================================
     * HUMAN
     * ========================================================
     */

    var humanConfig = {

      backend:
        'webgl',

      modelBasePath:
        'https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/models/',

      cacheSensitivity:
        0.01,

      filter: {

        enabled:
          true,

        equalization:
          true

      },

      face: {

        enabled:
          true,

        detector: {

          rotation:
            true,

          maxDetected:
            2,

          minConfidence:
            minConfidence

        },

        mesh: {

          enabled:
            true

        },

        description: {

          enabled:
            true

        },

        iris: {

          enabled:
            false

        },

        emotion: {

          enabled:
            false

        },

        antispoof: {

          enabled:
            false

        },

        liveness: {

          enabled:
            false

        }

      },

      body: {

        enabled:
          false

      },

      hand: {

        enabled:
          false

      },

      object: {

        enabled:
          false

      },

      gesture: {

        enabled:
          false

      }

    };


    var human =
      new Human.Human(
        humanConfig
      );


    /**
     * ========================================================
     * INICIO
     * ========================================================
     */

    async function initialize() {

      try {

        if (
          !token ||
          (
            mode !==
              'register' &&
            mode !==
              'recognize'
          )
        ) {

          throw new Error(
            'La sesión facial no es válida.'
          );

        }


        setStatus(
          'Solicitando permiso para utilizar la cámara...'
        );


        await startCamera();


        setStatus(
          'Cargando modelo de reconocimiento facial...'
        );


        await human.load();


        await human.warmup();


        if (
          mode ===
          'register'
        ) {

          updateEnrollmentInstruction();

        } else {

          setStatus(
            'Mira directamente a la cámara.'
          );


          updateProgress(
            0,
            samplesRequired
          );

        }


        detectionLoop();


      } catch (error) {

        console.error(
          error
        );


        setStatus(
          error &&
          error.message
            ? error.message
            : 'No fue posible iniciar la cámara.',
          true
        );

      }

    }


    /**
     * ========================================================
     * CÁMARA
     * ========================================================
     */

    async function startCamera() {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          'Este navegador no permite utilizar la cámara.'
        );

      }


      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            audio:
              false,

            video: {

              facingMode:
                'user',

              width: {
                ideal:
                  720
              },

              height: {
                ideal:
                  960
              }

            }

          });


      video.srcObject =
        stream;


      await new Promise(
        function(resolve) {

          if (
            video.readyState >=
            2
          ) {

            resolve();

            return;

          }


          video.onloadedmetadata =
            function() {

              resolve();

            };

        }
      );


      await video.play();
    }


    /**
     * ========================================================
     * LOOP DETECCIÓN
     * ========================================================
     */

    async function detectionLoop() {

      if (
        stopped
      ) {

        return;
      }


      /*
       * Mientras capturamos varias muestras
       * no ejecutar detección paralela.
       */
      if (
        capturing
      ) {

        setTimeout(
          detectionLoop,
          200
        );


        return;
      }


      if (
        detectionRunning ||
        video.readyState <
          2
      ) {

        setTimeout(
          detectionLoop,
          200
        );


        return;
      }


      detectionRunning =
        true;


      try {

        var result =
          await human.detect(
            video
          );


        evaluatePreview(
          result
        );


      } catch (error) {

        console.error(
          'Detection:',
          error
        );


      } finally {

        detectionRunning =
          false;


        if (
          !stopped
        ) {

          setTimeout(
            detectionLoop,
            250
          );

        }

      }

    }


    function evaluatePreview(
      result
    ) {

      captureButton.disabled =
        true;


      cameraContainer
        .classList
        .remove(
          'ready'
        );


      var validation =
        validateDetection(
          result
        );


      if (
        !validation.ok
      ) {

        setStatus(
          validation.message
        );


        return;
      }


      cameraContainer
        .classList
        .add(
          'ready'
        );


      captureButton.disabled =
        false;


      if (
        mode ===
        'register'
      ) {

        var instruction =
          getEnrollmentInstruction(
            enrollmentIndex
          );


        setStatus(
          instruction.text
        );

      } else {

        setStatus(
          '✓ Rostro preparado. Pulsa Verificar identidad.'
        );

      }

    }


    /**
     * ========================================================
     * VALIDAR DETECCIÓN
     * ========================================================
     */

    function validateDetection(
      result
    ) {

      if (
        !result ||
        !Array.isArray(
          result.face
        )
      ) {

        return {
          ok: false,
          message:
            'No se pudo analizar la imagen.'
        };

      }


      if (
        result.face.length ===
        0
      ) {

        return {
          ok: false,
          message:
            'No se detecta ningún rostro.'
        };

      }


      if (
        result.face.length >
        1
      ) {

        return {
          ok: false,
          message:
            'Debe aparecer solamente una persona frente a la cámara.'
        };

      }


      var face =
        result.face[0];


      var confidence =
        Number(
          face.faceScore ||
          face.boxScore ||
          0
        );


      if (
        confidence <
        minConfidence
      ) {

        return {
          ok: false,
          message:
            'Mejora la iluminación o acércate ligeramente a la cámara.'
        };

      }


      if (
        !face.embedding ||
        !face.embedding.length
      ) {

        return {
          ok: false,
          message:
            'Preparando perfil facial...'
        };

      }


      return {

        ok: true,

        face:
          face,

        confidence:
          confidence

      };
    }


    /**
     * ========================================================
     * BOTÓN PRINCIPAL
     * ========================================================
     */

    captureButton
      .addEventListener(
        'click',
        function() {

          if (
            mode ===
            'register'
          ) {

            captureEnrollmentSample();

          } else {

            captureRecognitionBatch();

          }

        }
      );


    /**
     * ========================================================
     * REGISTRO MULTI-MUESTRA
     * ========================================================
     */

    async function captureEnrollmentSample() {

      if (
        capturing
      ) {

        return;
      }


      capturing =
        true;


      captureButton.disabled =
        true;


      try {

        setStatus(
          'Capturando muestra...'
        );


        var captured =
          await captureValidFace(
            4
          );


        enrollmentEmbeddings.push(
          Array.from(
            captured.face.embedding
          )
        );


        enrollmentQualities.push(
          captured.confidence
        );


        var instruction =
          getEnrollmentInstruction(
            enrollmentIndex
          );


        enrollmentLabels.push(
          instruction.label
        );


        enrollmentIndex++;


        updateProgress(
          enrollmentIndex,
          samplesRequired
        );


        if (
          enrollmentIndex >=
          samplesRequired
        ) {

          setStatus(
            'Perfil completo. Enviando muestras para validación...'
          );


          sendEnrollmentBatch();


          return;
        }


        /*
         * Pequeño espacio temporal para evitar
         * capturar exactamente el mismo instante.
         */
        await sleep(
          650
        );


        capturing =
          false;


        updateEnrollmentInstruction();


      } catch (error) {

        console.error(
          error
        );


        capturing =
          false;


        captureButton.disabled =
          false;


        setStatus(
          error &&
          error.message
            ? error.message
            : 'No fue posible capturar la muestra.',
          true
        );

      }

    }


    function updateEnrollmentInstruction() {

      var instruction =
        getEnrollmentInstruction(
          enrollmentIndex
        );


      captureButton.textContent =
        'Capturar muestra ' +
        (
          enrollmentIndex + 1
        ) +
        '/' +
        samplesRequired;


      setStatus(
        instruction.text
      );


      updateProgress(
        enrollmentIndex,
        samplesRequired
      );
    }


    function sendEnrollmentBatch() {

      if (
        !window.opener
      ) {

        throw new Error(
          'No fue posible comunicarse con la aplicación principal.'
        );

      }


      window.opener.postMessage(

        {

          source:
            'face-camera-app',

          action:
            'FACE_ENROLLMENT_BATCH',

          token:
            token,

          embeddings:
            enrollmentEmbeddings,

          qualities:
            enrollmentQualities,

          labels:
            enrollmentLabels,

          model:
            'faceres',

          version:
            human.version

        },

        '*'

      );


      stopCamera();


      setTimeout(
        function() {

          window.close();

        },
        900
      );
    }


    /**
     * ========================================================
     * RECONOCIMIENTO MULTI-FRAME
     * ========================================================
     */

    async function captureRecognitionBatch() {

      if (
        capturing
      ) {

        return;
      }


      capturing =
        true;


      captureButton.disabled =
        true;


      var embeddings =
        [];


      try {

        for (
          var i = 0;
          i < samplesRequired;
          i++
        ) {

          setStatus(
            'Analizando muestra ' +
            (
              i + 1
            ) +
            ' de ' +
            samplesRequired +
            '...'
          );


          var captured =
            await captureValidFace(
              5
            );


          embeddings.push(
            Array.from(
              captured.face.embedding
            )
          );


          updateProgress(
            i + 1,
            samplesRequired
          );


          if (
            i <
            samplesRequired - 1
          ) {

            await sleep(
              350
            );

          }

        }


        setStatus(
          'Muestras obtenidas. Comparando identidad...'
        );


        if (
          !window.opener
        ) {

          throw new Error(
            'No fue posible comunicarse con la aplicación principal.'
          );

        }


        window.opener.postMessage(

          {

            source:
              'face-camera-app',

            action:
              'FACE_RECOGNITION_BATCH',

            token:
              token,

            embeddings:
              embeddings,

            model:
              'faceres',

            version:
              human.version

          },

          '*'

        );


        stopCamera();


        setTimeout(
          function() {

            window.close();

          },
          900
        );


      } catch (error) {

        console.error(
          error
        );


        capturing =
          false;


        captureButton.disabled =
          false;


        updateProgress(
          0,
          samplesRequired
        );


        setStatus(
          error &&
          error.message
            ? error.message
            : 'No fue posible obtener muestras consistentes.',
          true
        );

      }

    }


    /**
     * ========================================================
     * CAPTURAR UNA MUESTRA VÁLIDA
     * ========================================================
     */

    async function captureValidFace(
      maxAttempts
    ) {

      var lastMessage =
        'No fue posible obtener una muestra facial válida.';


      for (
        var attempt = 0;
        attempt < maxAttempts;
        attempt++
      ) {

        var result =
          await human.detect(
            video
          );


        var validation =
          validateDetection(
            result
          );


        if (
          validation.ok
        ) {

          return validation;

        }


        lastMessage =
          validation.message;


        await sleep(
          250
        );

      }


      throw new Error(
        lastMessage
      );
    }


    /**
     * ========================================================
     * PROGRESO
     * ========================================================
     */

    function updateProgress(
      current,
      total
    ) {

      var percent =
        total > 0
          ? (
              current /
              total
            ) *
            100
          : 0;


      progressBar.style.width =
        percent +
        '%';


      progressText.textContent =
        current +
        ' de ' +
        total +
        ' muestras';
    }


    /**
     * ========================================================
     * CANCELAR
     * ========================================================
     */

    cancelButton
      .addEventListener(
        'click',
        function() {

          stopCamera();

          window.close();

        }
      );


    function stopCamera() {

      stopped =
        true;


      if (
        stream
      ) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      video.srcObject =
        null;
    }


    window.addEventListener(
      'beforeunload',
      stopCamera
    );


    /**
     * ========================================================
     * AUXILIARES
     * ========================================================
     */

    function sleep(
      milliseconds
    ) {

      return new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            milliseconds
          );

        }
      );
    }


    function setStatus(
      message,
      error
    ) {

      statusElement.textContent =
        message;


      statusElement
        .classList
        .toggle(
          'error',
          Boolean(
            error
          )
        );
    }


    initialize();

  </script>

</body>

</html>
